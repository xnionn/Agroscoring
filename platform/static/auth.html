<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Система AgrIscore</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand"><span><span class="brand-accent">A</span>gr<span class="brand-accent">I</span>score</span></a>
    </nav>

    <div class="auth-container">
        <!-- Geometric shapes background -->
        <div class="hero-shapes" style="position:absolute;inset:0;overflow:hidden;z-index:0;">
            <div class="shape s1"><div class="shape__float"><div class="shape__pill"></div></div></div>
            <div class="shape s2"><div class="shape__float"><div class="shape__pill"></div></div></div>
            <div class="shape s3"><div class="shape__float"><div class="shape__pill"></div></div></div>
            <div class="shape s4"><div class="shape__float"><div class="shape__pill"></div></div></div>
            <div class="shape s5"><div class="shape__float"><div class="shape__pill"></div></div></div>
        </div>

        <div class="auth-card animate-in">
            <h2 class="text-center" style="margin-bottom: 8px;">Добро пожаловать</h2>
            <p class="subtitle text-center" style="font-size: 0.9rem; margin-bottom: 24px;">
                Войдите или создайте аккаунт
            </p>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Вход</button>
                <button class="auth-tab" onclick="switchTab('register')">Регистрация</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group mb-md">
                    <label>Email</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="farmer@example.com" required>
                </div>
                <div class="form-group mb-lg">
                    <label>Пароль</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
                </div>
                <div style="text-align: right; margin-bottom: 24px;">
                    <a href="#" onclick="switchTab('forgot'); return false;" style="color: var(--primary); font-size: 0.85rem; text-decoration: none;">Забыли пароль?</a>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;" id="loginBtn">Войти</button>
                <p id="loginError" style="color: var(--red); font-size: 0.85rem; margin-top: 12px; text-align: center;"></p>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
                <div class="form-group mb-md">
                    <label>Полное имя</label>
                    <input type="text" class="form-input" id="regName" placeholder="Асылбек Қалиев" required>
                </div>
                <div class="form-group mb-md">
                    <label>Email</label>
                    <input type="email" class="form-input" id="regEmail" placeholder="farmer@example.com" required>
                </div>
                <div class="form-group mb-md">
                    <label>Пароль</label>
                    <input type="password" class="form-input" id="regPassword" placeholder="Минимум 6 символов" required minlength="6">
                </div>
                <div class="form-group mb-lg">
                    <label>Роль</label>
                    <select class="form-select" id="regRole">
                        <option value="farmer">Фермер</option>
                        <option value="commissioner">Комиссия МСХ</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;" id="regBtn">Создать аккаунт</button>
                <p id="regError" style="color: var(--red); font-size: 0.85rem; margin-top: 12px; text-align: center;"></p>
            </form>

            <!-- Forgot Password Form -->
            <form id="forgotForm" class="hidden" onsubmit="handleForgot(event)">
                <div class="form-group mb-md">
                    <label>Email для восстановления</label>
                    <input type="email" class="form-input" id="forgotEmail" placeholder="farmer@example.com" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;" id="forgotBtn">Отправить письмо</button>
                <div class="text-center" style="margin-top: 15px;">
                    <a href="#" onclick="switchTab('login'); return false;" style="color: var(--primary); text-decoration: none; font-size: 0.9rem;">Вернуться ко входу</a>
                </div>
                <p id="forgotMsg" style="font-size: 0.85rem; margin-top: 12px; text-align: center;"></p>
            </form>

            <!-- Reset Password Form -->
            <form id="resetForm" class="hidden" onsubmit="handleReset(event)">
                <div class="form-group mb-lg">
                    <label>Новый пароль</label>
                    <input type="password" class="form-input" id="resetPassword" placeholder="Минимум 6 символов" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;" id="resetBtn">Сохранить пароль</button>
                 <div class="text-center" style="margin-top: 15px;">
                    <a href="#" onclick="switchTab('login'); return false;" style="color: var(--primary); text-decoration: none; font-size: 0.9rem;">Вернуться ко входу</a>
                </div>
                <p id="resetMsg" style="font-size: 0.85rem; margin-top: 12px; text-align: center;"></p>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('forgotForm').classList.add('hidden');
            document.getElementById('resetForm').classList.add('hidden');
            document.querySelector('.auth-tabs').style.display = (tab === 'forgot' || tab === 'reset') ? 'none' : 'flex';
            
            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.remove('hidden');
            } else if (tab === 'register') {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.remove('hidden');
            } else if (tab === 'forgot') {
                document.getElementById('forgotForm').classList.remove('hidden');
            } else if (tab === 'reset') {
                document.getElementById('resetForm').classList.remove('hidden');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('loginError');
            btn.disabled = true; btn.textContent = 'Вход...'; errEl.textContent = '';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value,
                    }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Login failed');
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = data.user.role === 'farmer' ? '/portal' : '/dashboard';
            } catch (err) {
                errEl.textContent = err.message;
            } finally {
                btn.disabled = false; btn.textContent = 'Войти';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('regBtn');
            const errEl = document.getElementById('regError');
            btn.disabled = true; btn.textContent = 'Создание...'; errEl.textContent = '';
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name: document.getElementById('regName').value,
                        email: document.getElementById('regEmail').value,
                        password: document.getElementById('regPassword').value,
                        role: document.getElementById('regRole').value,
                    }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Register failed');
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = data.user.role === 'farmer' ? '/portal' : '/dashboard';
            } catch (err) {
                errEl.textContent = err.message;
            } finally {
                btn.disabled = false; btn.textContent = 'Создать аккаунт';
            }
        }

        async function handleForgot(e) {
            e.preventDefault();
            const btn = document.getElementById('forgotBtn');
            const msgEl = document.getElementById('forgotMsg');
            btn.disabled = true; btn.textContent = 'Отправка...'; msgEl.textContent = ''; msgEl.style.color = 'var(--text-muted)';
            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('forgotEmail').value })
                });
                const data = await res.json();
                msgEl.style.color = 'var(--green)';
                msgEl.textContent = data.message;
            } catch (err) {
                msgEl.style.color = 'var(--red)';
                msgEl.textContent = 'Ошибка при отправке: ' + err.message;
                btn.disabled = false; btn.textContent = 'Отправить письмо';
            }
        }

        async function handleReset(e) {
            e.preventDefault();
            const btn = document.getElementById('resetBtn');
            const msgEl = document.getElementById('resetMsg');
            btn.disabled = true; btn.textContent = 'Сохранение...'; msgEl.textContent = ''; msgEl.style.color = 'var(--text-muted)';
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('reset_token');
            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, new_password: document.getElementById('resetPassword').value })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Ошибка сброса');
                msgEl.style.color = 'var(--green)';
                msgEl.textContent = data.message;
                setTimeout(() => window.location.href = '/auth', 3000);
            } catch (err) {
                msgEl.style.color = 'var(--red)';
                msgEl.textContent = err.message;
                btn.disabled = false; btn.textContent = 'Сохранить пароль';
            }
        }

        // Check URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const resetToken = urlParams.get('reset_token');
        
        if (resetToken) {
            switchTab('reset');
        } else {
            // Redirect if already logged in (only if not resetting password)
            const t = localStorage.getItem('token');
            const u = JSON.parse(localStorage.getItem('user') || 'null');
            if (t && u) window.location.href = u.role === 'farmer' ? '/portal' : '/dashboard';
        }

        const authType = urlParams.get('type');
        const authRole = urlParams.get('role');

        if (authType === 'reg') {
            switchTab('register');
        }

        if (authRole) {
            const roleSelect = document.getElementById('regRole');
            if (roleSelect) {
                roleSelect.value = authRole;
                roleSelect.disabled = true;
                // Add note to inform user
                const label = roleSelect.previousElementSibling;
                if (label) {
                    label.innerHTML = 'Роль <span style="font-size:0.75rem; color:var(--text-muted); font-weight:normal;">(выбрана при входе, изменить нельзя)</span>';
                }
            }
        }
    </script>
</body>
</html>
